<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Turnstile — official test-key demo</title>
  <style>
    body { max-width: 760px; margin: 60px auto; padding: 0 28px; font: 18px/1.6 system-ui, sans-serif; color: #19352b; background: #f5f8f6; }
    h1 { line-height: 1.2; }
    pre { padding: 20px; background: white; border: 1px solid #d4ded8; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
  <script>
    window.demoResult = null;
    window.onDemoToken = token => {
      window.demoResult = { token };
      document.querySelector('#status').textContent = 'Đã nhận token thử nghiệm từ widget.';
      document.querySelector('#token').textContent = token;
    };
    window.onDemoError = error => {
      window.demoResult = { error };
      document.querySelector('#status').textContent = 'Widget báo lỗi: ' + error;
    };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <h1>Turnstile test token</h1>
  <p>Demo cục bộ sử dụng test key “always passes” chính thức của Cloudflare.</p>
  <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA"
    data-callback="onDemoToken" data-error-callback="onDemoError"></div>
  <p id="status">Đang chờ widget cấp token thử nghiệm…</p>
  <pre id="token">Chưa có token.</pre>
  <p>Token test có thể lặp lại và không dùng được trên website production.</p>
</body>
</html>
